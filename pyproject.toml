[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-tool-calling-agent"
version = "0.1.0"
description = "A small runtime where policy, not the planner, controls tool execution."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
